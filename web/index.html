<script src="flutter_bootstrap.js" async></script>
  <script>
    (function () {
      const userAgent = navigator.userAgent || navigator.vendor || window.opera;

      const isAndroid = /android/i.test(userAgent);
      const isIOS =
        /iPad|iPhone|iPod/.test(userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

      if (isAndroid) {
        // window.location.replace(
        //   'https://play.google.com/store/apps/details?id=com.zeelearn.intranet&hl=en_IN'
        // );
        window.location.href =
          "intent://#Intent;" +
          "scheme=zeelearn;" +
          "package=com.zeelearn.intranet;" +
          "S.browser_fallback_url=https://play.google.com/store/apps/details?id=com.zeelearn.intranet;" +
          "end";
      } else if (isIOS) {
        window.location.replace(
          'https://apps.apple.com/in/app/zeelearn-intranet/id6443464060'
        );
      }
    })();
  </script>
